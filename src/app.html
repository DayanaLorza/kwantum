<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#000000" />
		<meta name="author" content="Kwantum Tech" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
		<script>
			// Apollo visitor tracker — deferred to idle so it never competes with
			// first paint or the hero media for bandwidth.
			function initApollo() {
				var n = Math.random().toString(36).substring(7),
					o = document.createElement('script');
				o.src = 'https://assets.apollo.io/micro/website-tracker/tracker.iife.js?nocache=' + n;
				o.async = true;
				o.defer = true;
				o.onload = function () {
					window.trackingFunctions.onLoad({ appId: '6a0747d1c0e8780019e178a2' });
				};
				document.head.appendChild(o);
			}
			if ('requestIdleCallback' in window) {
				requestIdleCallback(initApollo, { timeout: 4000 });
			} else {
				window.addEventListener('load', function () { setTimeout(initApollo, 1500); });
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div
				style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000000;color:#e0ffe0;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center;"
			>
				<div style="max-width:520px;">
					<h1 style="color:#00ff41;font-size:1.75rem;margin:0 0 12px;font-weight:700;">Kwantum Tech</h1>
					<p style="font-size:1.05rem;line-height:1.6;margin:0 0 24px;color:#b8ccb8;">
						This page needs JavaScript to load fully. If you're viewing it inside an
						embedded preview or email client, please open it directly in your browser.
					</p>
					<p style="font-size:1rem;line-height:1.8;margin:0;">
						<a href="https://kwantumtech.com/" style="color:#00ff41;text-decoration:none;">kwantumtech.com</a><br />
						<a href="https://calendly.com/kwantumconsulting/30min" style="color:#00ff41;text-decoration:none;">Book a call</a>
					</p>
				</div>
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
